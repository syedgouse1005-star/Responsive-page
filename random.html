<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="generate()">generate password</button>
    <script>
        function generate() {
            var passwordList = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()"
            password = []
                //console.log(Math.floor(Math.random() * 18))
                //console.log(passwordList.charAt(60))
            for (let i = 0; i < 6; i++) {
                var randomnumber = Math.floor(Math.random() * passwordList.length)
                    //console.log(randomnumber)
                var randomchar = passwordList.charAt(randomnumber)
                    //console.log(randomchar)
                password.push(randomchar)
            }
            password = password.join("")
            console.log(password)
        }
    </script>
</body>

</html>
